apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cart-retry
  namespace: dev
spec:
  hosts:
    - cart
    - cart.dev.svc.cluster.local
  http:
    - route:
        - destination:
            host: cart
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure,retriable-4xx
      timeout: 10s

